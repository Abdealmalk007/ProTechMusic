name: ProTech Music Beta 9 build and JVM QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta9:
    name: Android 35 unsigned build and JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check version
        run: |
          grep -q 'versionCode = 20' app/build.gradle.kts
          grep -q 'versionName = "0.4.7-beta.9"' app/build.gradle.kts
      - name: JVM unit tests, debug APK and unsigned release APK
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Upload unsigned APK and test evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: protech-music-beta9-unsigned-qa
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/debug/app-debug.apk
            app/build/test-results/testDebugUnitTest/TEST-*.xml
          if-no-files-found: error
          retention-days: 7
