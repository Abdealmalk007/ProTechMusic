name: NextGen real MediaStore scale QA
on:
  push:
    branches: ['feature/nextgen-music-1.0']
    paths: ['.github/workflows/nextgen-real-scale.yml', 'scripts/qa/nextgen-real-scale.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon --console=plain :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: scale-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
  scale:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        count: [1000, 10000, 50000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: scale-debug-apk
      - name: Enable KVM on hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/qa/nextgen-real-scale.sh ${{ matrix.count }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-mediastore-${{ matrix.count }}
          path: qa-scale-evidence/
          retention-days: 14
