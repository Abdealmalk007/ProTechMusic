name: NextGen Android runtime QA
on:
  push:
    branches: ['feature/nextgen-music-1.0']
    paths: ['.github/workflows/nextgen-runtime.yml', 'app/src/**', 'scripts/qa/nextgen-runtime-ci.sh', 'scripts/qa/nextgen-permission-ui.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug and instrumentation APKs
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM on hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Isolated API35 runtime checks
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/qa/nextgen-runtime-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextgen-api35-runtime-evidence
          path: |
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            qa-runtime-evidence/
          retention-days: 14
